[project]
name = "anomaly-detection"
version = "0.1.0"
description = "Software for detecting anomalies in windows logs"
authors = [
    {name = "aobh2763",email = "benhazem.ahmedomar@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas (>=3.0.3,<4.0.0)",
    "matplotlib (>=3.11.0,<4.0.0)",
    "numpy (>=2.5.0,<3.0.0)",
    "python-evtx (>=0.8.1,<0.9.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ruff (>=0.15.20,<0.16.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "ipykernel (>=7.3.0,<8.0.0)"
]
