[project]
name = "anomaly_detection"
version = "0.1.0"
description = "Software for detecting anomalies in windows logs"
authors = [
    {name = "aobh2763",email = "benhazem.ahmedomar@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas (>=3.0.3,<4.0.0)",
    "matplotlib (>=3.11.0,<4.0.0)",
    "numpy (>=2.5.0,<3.0.0)",
    "evtx (>=0.12.1,<0.13.0)",
    "scikit-learn (>=1.9.0,<2.0.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "sentence-transformers (>=5.6.0,<6.0.0)",
    "pydantic (>=2.13.4,<3.0.0)",
    "sqlmodel (>=0.0.39,<0.0.40)",
    "fastapi (>=0.140.0,<0.141.0)",
    "uvicorn (>=0.51.0,<0.52.0)",
    "python-multipart (>=0.0.32,<0.0.33)",
    "joblib (>=1.5.3,<2.0.0)",
    "dill (>=0.4.1,<0.5.0)",
    "xmltodict (>=1.0.4,<2.0.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ruff (>=0.15.20,<0.16.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "ipykernel (>=7.3.0,<8.0.0)",
    "notebook (>=7.6.0,<8.0.0)"
]

[tool.poetry]
packages = [
    { include = "anomaly_detection", from = "src" }
]